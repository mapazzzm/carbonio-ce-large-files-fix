# Snippet for nginx.conf.web.https.template and nginx.conf.web.https.default.template
# Insert these 6 location blocks BEFORE the existing `location /services/files/`.
#
# 1. /services/storages/quota/myself — stub. Carbonio CE doesn't implement it
#    (Java returns 403 + console errors); we reply with a fake "unlimited"
#    payload so the UI is happy.
# 2. /services/files/upload-chunked  → sidecar chunked-upload finaliser.
# 3. /services/files/upload          → Java carbonio-files (bypasses envoy).
# 4. /services/files/public/link/download/ → sidecar public-link sendfile.
# 5. /services/files/download/       → sidecar authenticated UI sendfile.
# 6. = /services/files/public/download-multiple → sidecar folder ZIP. Exact
#    match so the sibling .../download-multiple/check preflight still reaches
#    Java; only the archive POST is intercepted.
#
# Blocks 2,3,5 share the same auth gate (redirect to /static/login/ if the
# ZM_AUTH_TOKEN cookie is missing — presence only; real auth is enforced
# downstream). Blocks 4 and 6 are intentionally open (public links carry their
# own token/access-code, validated against the DB by the sidecar). Each uses
# `proxy_pass http://host:port/path;` with a URI suffix, so nginx replaces the
# matched location prefix with that suffix — no rewrite needed.

    location = /services/storages/quota/myself {
        default_type application/json;
        return 200 '{"used":0,"limit":-1}';
    }

    location ^~ /services/files/upload-chunked
    {
        set $AUTH_COOKIE_MISSING 0;
        if ($http_cookie !~ "ZM_AUTH_TOKEN=") {
            set $AUTH_COOKIE_MISSING 1;
        }
        if ( $AUTH_COOKIE_MISSING = 1) {
            return 307 "/static/login/";
        }
        proxy_request_buffering off;
        proxy_read_timeout      7200;
        proxy_send_timeout      7200;
        client_body_timeout     7200;
        proxy_http_version      1.1;
        proxy_set_header        Connection "";
        proxy_set_header        Host $host;
        proxy_pass              http://127.0.0.1:5795/upload-chunked;
    }

    location ^~ /services/files/upload
    {
        set $AUTH_COOKIE_MISSING 0;
        if ($http_cookie !~ "ZM_AUTH_TOKEN=") {
            set $AUTH_COOKIE_MISSING 1;
        }
        if ( $AUTH_COOKIE_MISSING = 1) {
            return 307 "/static/login/";
        }
        proxy_request_buffering off;
        proxy_read_timeout      3600;
        proxy_send_timeout      3600;
        client_body_timeout     3600;
        proxy_http_version      1.1;
        proxy_set_header        Connection "";
        proxy_set_header        Host $host;
        proxy_pass              http://127.78.0.2:10000/upload;
    }

    location ^~ /services/files/public/link/download/ {
        proxy_request_buffering off;
        proxy_read_timeout      7200;
        proxy_send_timeout      7200;
        proxy_http_version      1.1;
        proxy_set_header        Connection "";
        proxy_set_header        Host $host;
        proxy_pass              http://127.0.0.1:5795/public-download/;
    }

    # Public folder ZIP download. Exact match: only the archive POST is taken
    # here; the sibling .../download-multiple/check preflight falls through to
    # Java. Bypasses Java's large-blob EOF/OOM by streaming a ZIP64 archive
    # built from disk in the sidecar. proxy_buffering off → the multi-GB body
    # is relayed as produced, never spooled.
    location = /services/files/public/download-multiple {
        proxy_request_buffering off;
        proxy_buffering         off;
        proxy_read_timeout      7200;
        proxy_send_timeout      7200;
        proxy_http_version      1.1;
        proxy_set_header        Connection "";
        proxy_set_header        Host $host;
        proxy_pass              http://127.0.0.1:5795/public-download-multiple;
    }

    location ^~ /services/files/download/ {
        set $AUTH_COOKIE_MISSING 0;
        if ($http_cookie !~ "ZM_AUTH_TOKEN=") {
            set $AUTH_COOKIE_MISSING 1;
        }
        if ( $AUTH_COOKIE_MISSING = 1) {
            return 307 "/static/login/";
        }
        proxy_request_buffering off;
        proxy_read_timeout      7200;
        proxy_send_timeout      7200;
        proxy_http_version      1.1;
        proxy_set_header        Connection "";
        proxy_set_header        Host $host;
        proxy_set_header        Cookie $http_cookie;
        proxy_pass              http://127.0.0.1:5795/ui-download/;
    }
